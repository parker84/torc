appId: dev.torc.app
productName: Torc
copyright: Copyright © 2026 Brydon Parker

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # electron-vite bundles the renderer's deps, but externalizes main's — and
  # node-pty is the one that has to exist on disk at runtime.
  - node_modules/node-pty/**

# node-pty ships a native binding that must not be packed into the asar.
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # Unsigned local builds: without this, macOS quarantines the app on first run.
  identity: null

dmg:
  title: Torc ${version}
